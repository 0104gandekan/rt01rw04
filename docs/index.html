    .prayer-card{padding:14px}.prayer-hero{aspect-ratio:4/3;border-radius:18px;background-size:cover;background-position:center;position:relative;color:#fff;overflow:hidden}.prayer-hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(2,24,44,.25),rgba(2,24,44,.65))}.prayer-overlay{position:absolute;z-index:1;inset:0;padding:14px;display:flex;justify-content:space-between;align-items:flex-start}.clock-big{font-size:30px;font-weight:800}.prayer-date{text-align:right;font-size:11px;font-weight:700}

    .religious-list{display:grid;gap:8px;padding:0 12px 14px}.religious-item{width:100%;min-height:68px;border:1px solid #e7edf3!important;border-radius:14px;color:#1f2937;padding:10px 11px;background:#fff!important;display:grid;grid-template-columns:44px 1fr 18px;align-items:center;gap:10px;box-shadow:0 4px 14px rgba(20,45,70,.04);text-align:left}.religious-item:before{display:none}.religious-icon{width:44px;height:44px;border-radius:13px;display:grid!important;place-items:center;margin:0!important;box-shadow:inset 0 0 0 1px rgba(255,255,255,.55)}.religious-icon svg{width:23px;height:23px;display:block;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.religious-icon.ri-yasin{background:#eaf8f2;color:#08775e}.religious-icon.ri-barzanji{background:#fff4e5;color:#c76a00}.religious-icon.ri-tpa{background:#eef4ff;color:#1768d5}.religious-icon.ri-semakan{background:#f3edff;color:#7c3aed}.religious-icon.ri-default{background:#edf7f6;color:#0f766e}.religious-copy{min-width:0;display:block!important;margin:0!important}.religious-copy b{font-size:11px;display:block;color:#1f2937}.religious-copy>span{display:block;font-size:9px;line-height:1.45;margin-top:3px;color:#667085;white-space:normal}.religious-arrow{color:#98a2b3;font-size:10px;justify-self:end}.religious-head-svg{width:18px;height:18px;display:block;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

    /* ASSET CART / MARKETPLACE LOAN - V6.1 */

  <!-- V6 Classic Fast Hybrid: UI V3 + Firebase Auth/Firestore realtime + Google Apps Script/Drive media. -->
<div id="splash" class="app-loading">
    <div class="splash-box">
      <img class="splash-logo" src="./assets/logo.webp" alt="Logo RT">
      <div class="splash-title">RT 01 RW 04 Digital</div>
      <div class="splash-sub">Dusun II Pegandekan</div>

<script>
const LOGO = './assets/logo.webp';
const APP_VERSION = '6.1.2';
const state = {
  data:null, currentPage:'home', prayer:null, imsakiyah:null, weather:null, coords:null, locationWatchId:null, complaintPoint:null, complaintMap:null,
  userToken:localStorage.getItem('rt01_user_token')||'',
  user:null,
  adminToken:sessionStorage.getItem('rt01_admin_token')||'',
  adminUser:null, chart:null, activeAdminSection:'Dashboard', clockTimer:null, prayerDay:null,
  assetCart:loadAssetCart()
};

function weatherDescV51(code){
  code=Number(code);
  if(code===0)return 'Cerah';
  if([1,2].includes(code))return 'Cerah Berawan';
  if(code===3)return 'Berawan';
  if([45,48].includes(code))return 'Berkabut';
  if([51,53,55,56,57].includes(code))return 'Gerimis';
  if([61,63,65,66,67].includes(code))return 'Hujan';
  if([71,73,75,77].includes(code))return 'Hujan Salju';
  if([80,81,82].includes(code))return 'Hujan Lokal';
  if([95,96,99].includes(code))return 'Hujan Petir';
  return 'Cuaca berubah';
}
function periodV51(year,month){return `${Number(year)}-${String(Number(month)).padStart(2,'0')}`}
function publicBundleV51(d){
  const rows=d.rondaWeek||[];
  const today=(new Date()).toISOString().slice(0,10);
  const rondaToday=rows.find(x=>String(x.Tanggal||'').slice(0,10)===today)||rows[0]||{};
  return {...d,rondaToday,pengumuman:d.pengumuman||d.announcements||[],documents:d.documents||[],aduanTerbaru:d.aduanTerbaru||[]};
}
async function api(fn,...args){ return RTV6.call(fn,...args); }

document.addEventListener('DOMContentLoaded', init);

async function init(){
  bindPwaHooks();
  // Fast-first: render cache/default immediately, Firestore refreshes in background.
  state.data = RTV6.cachedBundle() || RTV6.defaultBundle();
  document.getElementById('splash').classList.add('hidden');
  if(location.hash.startsWith('#admin')){document.body.classList.remove('public-mode');showAdmin();}
  else{document.body.classList.add('public-mode');showPublic(location.hash.replace(/^#/,'')||'home');}
  try{
    await RTV6.init();
    try{const me=await RTV6.restoreSession(); if(me?.user){state.user=me.user;state.userToken=me.token||'firebase'; if(RTV6.isAdminProfile(me.user)){state.adminUser=me.user;state.adminToken='firebase'; if(location.hash.startsWith('#admin')) showAdmin();}}}catch(e){}
    const fresh=await api('getPublicAppData'); state.data=fresh; if(!location.hash.startsWith('#admin')) renderPublic();
    RTV6.startRealtime(bundle=>{state.data=bundle;if(!location.hash.startsWith('#admin'))renderPublic();updateNotificationBadge();},note=>{if(note?.ID && !isNotificationRead(note.ID)){toast(note.title||'Ada informasi baru');updateNotificationBadge();}});
  }catch(err){
    console.warn('Firebase init:',err);
    toast('Mode cache aktif: '+err.message);
  }
  window.addEventListener('hashchange',()=>{if(location.hash.startsWith('#admin'))showAdmin();else showPublic(location.hash.replace(/^#/,'')||'home');});
  navigator.serviceWorker?.addEventListener('message',e=>{if(e.data?.type==='OPEN_PAGE')go(e.data.page||'home')});
  startRealtimeClock();
  setTimeout(startPrayerLocationWatch,600);
}

function renderConnectionErrorV51(err){
  document.body.classList.add('public-mode');

function rondaFeature(r){
  r=r||{};

  const all=[...(state.data.rondaWeek||[])];
  const today=normalizeDate(todayStr());

  const todayRow=all.find(x=>normalizeDate(x.Tanggal)===today);

function religiousIconData(title){
  const t=String(title||'').toLowerCase();
  const icons={
    yasin:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 5.5c2.7-.8 5.3-.4 8 1.2v12c-2.7-1.6-5.3-2-8-1.2z"/><path d="M20.5 5.5c-2.7-.8-5.3-.4-8 1.2v12c2.7-1.6 5.3-2 8-1.2z"/><path d="M12 6.7v12"/><path d="M6 9h3.2M6 12h3.2M14.8 9H18M14.8 12H18"/></svg>`,
    barzanji:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2a7.2 7.2 0 1 0 7.2 7.2A6 6 0 0 1 12 3.2z"/><path d="m18.2 4.2.55 1.15 1.25.18-.9.88.21 1.24-1.11-.59-1.11.59.21-1.24-.9-.88 1.25-.18z"/><path d="M7 17.5h10"/></svg>`,
    tpa:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 9 9-4 9 4-9 4z"/><path d="M7 11.2V15c2.8 2 7.2 2 10 0v-3.8"/><path d="M21 9v5"/><path d="M12 17.5v3"/><path d="M9.5 20.5h5"/></svg>`,
    semakan:`<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 3v18"/><path d="M12 8h4M12 12h4M12 16h3"/><path d="M6.8 7h.2M6.8 11h.2M6.8 15h.2"/></svg>`,
    default:`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h16"/><path d="M6 20v-7.5c0-2.8 2.1-5.2 4.9-5.5V4.8L12 3l1.1 1.8V7c2.8.3 4.9 2.7 4.9 5.5V20"/><path d="M9 20v-4.5a3 3 0 0 1 6 0V20"/></svg>`
  };
  if(t.includes('yasin')) return {svg:icons.yasin,cls:'ri-yasin'};
  if(t.includes('barzanji')||t.includes('sholawat')) return {svg:icons.barzanji,cls:'ri-barzanji'};
  if(t.includes('tpa')||t.includes('pengajian')) return {svg:icons.tpa,cls:'ri-tpa'};
  if(t.includes('semakan')||t.includes('quran')||t.includes('alquran')||t.includes('al-quran')) return {svg:icons.semakan,cls:'ri-semakan'};
  return {svg:icons.default,cls:'ri-default'};
}

function switchWargaAuth(mode){
  const login=mode!=='register';
  document.getElementById('wargaLoginBox')?.classList.toggle('hidden',!login);
  document.getElementById('wargaRegisterBox')?.classList.toggle('hidden',login);
  document.getElementById('tabLoginWarga')?.classList.toggle('active',login);
  document.getElementById('tabRegisterWarga')?.classList.toggle('active',!login);
}
function toggleInputPass(id){const x=document.getElementById(id);if(x)x.type=x.type==='password'?'text':'password'}
async function submitWargaLogin(e){
  e.preventDefault();const fd=new FormData(e.currentTarget);
  try{
    const res=await busyCall(e.currentTarget.querySelector('[type=submit]'),'Masuk...',()=>api('userLogin',fd.get('email'),fd.get('password')));
    state.userToken=res.token;state.user=res.user;localStorage.setItem('rt01_user_token',res.token);toast('Login berhasil');go('account');
  }catch(err){toast(err.message)}
}
async function submitWargaRegister(e){
  e.preventDefault();const fd=new FormData(e.currentTarget);
  if(fd.get('password')!==fd.get('password2')){toast('Konfirmasi password tidak sama');return}
  const payload={nik:fd.get('nik'),nama:fd.get('nama'),email:fd.get('email'),noHP:fd.get('noHP'),password:fd.get('password')};
  try{
    const res=await busyCall(e.currentTarget.querySelector('[type=submit]'),'Mendaftar...',()=>api('userRegister',payload));
    toast(res.message||'Registrasi berhasil');e.currentTarget.reset();switchWargaAuth('login');
  }catch(err){toast(err.message)}
}
async function userLogoutUI(){
  try{await api('userLogout',state.userToken)}catch(e){}
  state.userToken='';state.user=null;localStorage.removeItem('rt01_user_token');toast('Anda sudah keluar');go('account');
}

function readNotificationIds(){try{return JSON.parse(localStorage.getItem('rt01-v6-read-notifications')||'[]')}catch(e){return[]}}
function isNotificationRead(id){return readNotificationIds().includes(String(id))}
function markNotificationRead(id){const a=readNotificationIds();if(!a.includes(String(id)))a.push(String(id));localStorage.setItem('rt01-v6-read-notifications',JSON.stringify(a.slice(-300)));updateNotificationBadge()}
function markAllNotificationsRead(){const ids=(state.data?.notifications||[]).map(x=>String(x.ID));localStorage.setItem('rt01-v6-read-notifications',JSON.stringify(ids.slice(-300)));updateNotificationBadge();renderPublic()}
function unreadNotifications(){return (state.data?.notifications||[]).filter(x=>!isNotificationRead(x.ID))}
function updateNotificationBadge(){const el=document.getElementById('notificationBadge');if(!el)return;const n=unreadNotifications().length;el.textContent=n>99?'99+':n;el.classList.toggle('hidden',n===0)}
function notificationTime(v){if(!v)return '';const d=new Date(v),ms=Date.now()-d.getTime(),m=Math.floor(ms/60000);if(m<1)return 'Baru saja';if(m<60)return m+' mnt';const h=Math.floor(m/60);if(h<24)return h+' jam';return d.toLocaleDateString('id-ID',{day:'numeric',month:'short'})}
function notificationsView(){const rows=state.data?.notifications||[];return `<div class="detail-hero"><h3><i class="fa-solid fa-bell"></i> Pusat Notifikasi</h3><p>Update otomatis jadwal ronda, Posyandu, kegiatan RT dan informasi penting.</p></div><div class="form-card"><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn btn-green" onclick="enablePushNotifications()"><i class="fa-solid fa-bell"></i> Aktifkan Push</button><button class="btn btn-light" onclick="markAllNotificationsRead()"><i class="fa-solid fa-check-double"></i> Tandai Semua Dibaca</button></div></div><div class="notification-list">${rows.length?rows.map(n=>`<button class="notification-item ${isNotificationRead(n.ID)?'':'unread'}" onclick="openNotification('${esc(n.ID)}','${esc(n.page||'home')}')"><span class="notification-icon"><i class="fa-solid ${n.category==='RONDA'?'fa-shield-halved':n.category==='POSYANDU'?'fa-kit-medical':n.category==='KEGIATAN'?'fa-calendar-days':'fa-bell'}"></i></span><span><b>${esc(n.title||'Informasi Baru')}</b><p>${esc(n.body||'')}</p><span class="mini-chip green">${esc(n.category||'INFO')}</span></span><span class="notification-time">${notificationTime(n.createdAt)}</span></button>`).join(''):emptyState('fa-bell-slash','Belum ada notifikasi','Update jadwal baru akan tampil otomatis di sini.')}</div>`}
function openNotification(id,page){markNotificationRead(id);go(page||'home')}
async function enablePushNotifications(){try{await RTV6.requestPushPermission();toast('Notifikasi push berhasil diaktifkan')}catch(e){toast(e.message)}}
async function forgotWargaPassword(){const email=prompt('Masukkan email akun warga:');if(!email)return;try{await api('passwordReset',email);toast('Email reset password sudah dikirim')}catch(e){toast(e.message)}}

function showQibla(){
  const cfg=state.data.config||{},lat=state.coords?.lat||Number(cfg.DEFAULT_LAT),lng=state.coords?.lng||Number(cfg.DEFAULT_LNG);
  const bearing=qiblaBearing(lat,lng);
  showModal(`<div class="modal-head"><h3>Arah Kiblat</h3><button class="close-btn" onclick="closeModal()">×</button></div><div style="text-align:center;padding:25px"><div style="width:170px;height:170px;border:10px solid #edf2f7;border-radius:50%;margin:auto;display:grid;place-items:center;position:relative"><i class="fa-solid fa-location-arrow" style="font-size:70px;color:#08775e;transform:rotate(${bearing}deg)"></i></div><h2>${bearing.toFixed(1)}°</h2><p style="font-size:12px;color:#667085">Arah dihitung dari koordinat perangkat menuju Ka'bah. Gunakan kompas perangkat untuk orientasi terhadap utara.</p></div>`);
}
function qiblaBearing(lat,lng){
  const kaLat=21.4225*Math.PI/180,kaLng=39.8262*Math.PI/180,phi=lat*Math.PI/180,lam=lng*Math.PI/180;
  const y=Math.sin(kaLng-lam),x=Math.cos(phi)*Math.tan(kaLat)-Math.sin(phi)*Math.cos(kaLng-lam);
  return (Math.atan2(y,x)*180/Math.PI+360)%360;
}
function updateNextPrayer(){
  if(!state.prayer)return;
  const entries=Object.entries(state.prayer.timings||{}), now=new Date();
  let target=null,name='';
  for(const [k,v] of entries){const [h,m]=String(v).split(':').map(Number),d=new Date();d.setHours(h,m,0,0);if(d>now){target=d;name=k;break;}}
  if(!target&&entries.length){const [h,m]=String(entries[0][1]).split(':').map(Number);target=new Date(Date.now()+86400000);target.setHours(h,m,0,0);name=entries[0][0];}
  if(!target)return;
  const diff=Math.max(0,target-now),hh=String(Math.floor(diff/3600000)).padStart(2,'0'),mm=String(Math.floor(diff%3600000/60000)).padStart(2,'0'),ss=String(Math.floor(diff%60000/1000)).padStart(2,'0');
  const text=`Selanjutnya: ${name} • ${hh}:${mm}:${ss}`;
  const el=document.getElementById('nextPrayer');if(el)el.textContent=text;
  document.querySelectorAll('.js-next-prayer').forEach(x=>x.textContent=text);
}

function renderCalendar(){
  const title=document.getElementById('calTitle'),grid=document.getElementById('calendarGrid');if(!title||!grid)return;
  const y=calDate.getFullYear(),m=calDate.getMonth(), first=new Date(y,m,1), last=new Date(y,m+1,0).getDate();
  title.textContent=calDate.toLocaleDateString('id-ID',{month:'long',year:'numeric'});
  const heads=['Min','Sen','Sel','Rab','Kam','Jum','Sab'];
  let html=heads.map((h,i)=>`<div class="cal-head ${i===0?'sun':''}">${h}</div>`).join('');
  for(let i=0;i<first.getDay();i++)html+='<div></div>';
  for(let d=1;d<=last;d++){
    const dt=new Date(y,m,d),isToday=dt.toDateString()===new Date().toDateString(),sun=dt.getDay()===0;
    html+=`<div class="cal-day ${isToday?'today':''} ${sun?'sun':''}">${d}</div>`;
  }
  grid.innerHTML=html;
  const now=new Date();
  document.getElementById('todayInfo').innerHTML=`Hari: <b>${now.toLocaleDateString('id-ID',{weekday:'long'})}</b><br>Tanggal: <b>${now.toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'})}</b><br>Pasaran Jawa: <b>${pasaranJawa(now)}</b><br>Weton: <b>${now.toLocaleDateString('id-ID',{weekday:'long'})} ${pasaranJawa(now)}</b>`;
}
function shiftCalendar(n){calDate=new Date(calDate.getFullYear(),calDate.getMonth()+n,1);renderCalendar()}
function pasaranJawa(d){
  // Referensi operasional: 1 Januari 2024 = Senin Pahing.
  const ref=new Date(2024,0,1),days=Math.floor((new Date(d.getFullYear(),d.getMonth(),d.getDate())-ref)/86400000);
  return ['Pahing','Pon','Wage','Kliwon','Legi'][((days%5)+5)%5];
}

let __chartLoader=null;
function ensureChartJs(){if(window.Chart)return Promise.resolve(window.Chart);if(__chartLoader)return __chartLoader;__chartLoader=new Promise((resolve,reject)=>{const sc=document.createElement('script');sc.src='https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js';sc.async=true;sc.onload=()=>resolve(window.Chart);sc.onerror=()=>reject(Error('Chart.js gagal dimuat'));document.head.appendChild(sc)});return __chartLoader}
async function drawFinanceChart(rows){
 const canvas=document.getElementById('financeChart');if(!canvas)return;
 if(!window.Chart){try{await ensureChartJs()}catch(e){console.warn('Chart.js:',e);return}}
 if(state.chart)state.chart.destroy();
 state.chart=new Chart(canvas,{type:'line',data:{labels:rows.map(x=>x.label),datasets:[
  {label:'Pemasukan',data:rows.map(x=>Number(x.masuk||0)/1000000),borderColor:'#079455',backgroundColor:'#079455',pointRadius:4,tension:.15},
  {label:'Pengeluaran',data:rows.map(x=>Number(x.keluar||0)/1000000),borderColor:'#ef4444',backgroundColor:'#ef4444',pointRadius:4,tension:.15}
 ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'top',align:'end',labels:{boxWidth:22,usePointStyle:true,pointStyle:'line'}}},scales:{y:{beginAtZero:true,ticks:{callback:v=>v+'M'},grid:{color:'#edf0f3'}},x:{grid:{display:false}}}}});
}

function letterFormPayload(){const f=document.getElementById('letterGeneratorForm');if(!f)return{};const fd=new FormData(f),o={};for(const[k,v]of fd.entries())o[k]=v;return o}

 }

function adminTable(sheet,rows){
 const headers=rows.length?Object.keys(rows[0]).slice(0,8):['ID'];

   if(sheet==='WARGA' && h==='NoHP'){
     const wa=waNumber(r[h]);

function formatCell(v){if(v===true)return 'Ya';if(v===false)return 'Tidak';if(typeof v==='string'&&v.length>50)return esc(v.slice(0,50))+'…';return esc(v??'')}

function fieldMarkup(f,val,row){

 if(f.type==='textarea')return `<div class="field"><label>${f.label}</label><textarea class="input" name="${f.name}">${esc(val||'')}</textarea></div>`;
 if(f.type==='checkbox')return `<label class="check"><input type="checkbox" name="${f.name}" ${String(val)==='true'||val===true?'checked':''}> ${f.label}</label>`;
 if(f.type==='select')return `<div class="field"><label>${f.label}</label><select class="input" name="${f.name}" ${f.name==='Jenis'?'onchange="syncFinanceCategorySelect(this.value)"':''}>${f.options.map(o=>`<option value="${esc(o)}" ${String(val)===String(o)?'selected':''}>${esc(f.name==='Jenis'?(o==='MASUK'?'Pemasukan':o==='KELUAR'?'Pengeluaran':o):o)}</option>`).join('')}</select></div>`;
 if(f.type==='finance-category'){
   const type=row?.Jenis||'MASUK', opts=financeCategoryList(type), all=[...new Set([...opts,String(val||'')].filter(Boolean))];

function openAdminForm(sheet,json=''){

  const fields=adminFields(sheet);
  const title=(row.ID?'Edit ':'Tambah ')+sheet.replaceAll('_',' ');
  showModal(`<div class="modal-head"><div><h3>${esc(title)}</h3><div style="font-size:10px;color:#667085">Simpan data realtime ke Firestore. Foto/dokumen otomatis dikirim ke Google Drive.</div></div><button class="close-btn" onclick="closeModal()">×</button></div><form id="adminCrudForm" class="form-grid" style="margin-top:14px"><input type="hidden" name="ID" value="${esc(row.ID||'')}">${fields.map(f=>fieldMarkup(f,row[f.name],row)).join('')}<div class="action-row"><button type="button" class="btn btn-light" onclick="closeModal()">Batal</button><button type="submit" class="btn btn-green"><i class="fa-solid fa-floppy-disk"></i> Simpan</button></div></form>`);
  const form=document.getElementById('adminCrudForm');
  form.addEventListener('submit',async e=>{
    e.preventDefault();
    const fd=new FormData(form), rec=Object.fromEntries(fd); const uploadFile=form.querySelector('[name="__upload"]')?.files?.[0]||null; delete rec.__upload;
    fields.forEach(f=>{
      if(f.type==='number')rec[f.name]=Number(rec[f.name]||0);
      if(f.type==='checkbox')rec[f.name]=!!form.querySelector(`[name="${f.name}"]`)?.checked;
    });
    try{
      if(uploadFile) await RTV6.uploadAdminMedia(sheet,rec,uploadFile);
      await busyCall(form.querySelector('[type=submit]'),'Menyimpan...',()=>api('adminUpsert',sheet,rec,state.adminToken));
      closeModal(); toast('Data berhasil disimpan'); await refreshPublicDataV51(); await adminNavigate(state.activeAdminSection);
    }catch(err){toast(err.message)}
  });
}

function initSignaturePad(id){
 const c=document.getElementById(id);if(!c)return;const ctx=c.getContext('2d');
 const rect=c.getBoundingClientRect();c.width=Math.max(400,Math.floor(rect.width*devicePixelRatio));c.height=Math.floor(160*devicePixelRatio);ctx.scale(devicePixelRatio,devicePixelRatio);ctx.lineWidth=2;ctx.lineCap='round';ctx.strokeStyle='#111827';
 let draw=false;
 const pos=e=>{const r=c.getBoundingClientRect(),p=e.touches?e.touches[0]:e;return{x:p.clientX-r.left,y:p.clientY-r.top}};
 const start=e=>{draw=true;c.dataset.signed='1';const p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y);e.preventDefault()};
 const move=e=>{if(!draw)return;const p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke();e.preventDefault()};
 const end=()=>draw=false;
 c.addEventListener('mousedown',start);c.addEventListener('mousemove',move);window.addEventListener('mouseup',end);c.addEventListener('touchstart',start,{passive:false});c.addEventListener('touchmove',move,{passive:false});c.addEventListener('touchend',end);
}
function clearSig(id){const c=document.getElementById(id),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);c.dataset.signed='0'}
async function saveSig(role,id){try{const c=document.getElementById(id);if(c?.dataset.signed!=='1'){toast('Silakan isi tanda tangan terlebih dahulu');return}const data=c.toDataURL('image/png'),res=await api('adminSaveSignature',role,data,state.adminToken);const key=role==='KETUA'?'SIGN_KETUA_URL':'SIGN_BENDAHARA_URL';if(state.data?.config)state.data.config[key]=res.url||data;toast('Tanda tangan disimpan')}catch(err){toast(err.message)}}

/* COMMON HELPERS */
function showModal(html){document.getElementById('modalBox').innerHTML=html;document.getElementById('modal').classList.add('show')}
function closeModal(){document.getElementById('modal').classList.remove('show')}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.__tt);window.__tt=setTimeout(()=>t.classList.remove('show'),3000)}
async function busyCall(btn,text,fn){const old=btn?.innerHTML;if(btn){btn.disabled=true;btn.textContent=text}try{return await fn()}finally{if(btn){btn.disabled=false;btn.innerHTML=old}}}
function rp(v){return 'Rp '+(Number(v)||0).toLocaleString('id-ID')}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function parseJson(s,f){try{return typeof s==='string'?JSON.parse(s):s||f}catch(e){return f}}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function normalizeDate(v){const s=String(v||'');const m=s.match(/^(\d{4}-\d{2}-\d{2})/);return m?m[1]:s}
function formatLongDate(v){const s=normalizeDate(v);const d=new Date(s+'T00:00:00');return isNaN(d)?s:d.toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function formatShortDate(v){const s=normalizeDate(v);const d=new Date(s+'T00:00:00');return isNaN(d)?s:d.toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'})}
function greeting(){const h=new Date().getHours();return h<11?'Selamat Pagi':h<15?'Selamat Siang':h<18?'Selamat Sore':'Selamat Malam'}
function liveTime(){return new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit',hour12:false})}
function startRealtimeClock(){if(state.clockTimer)return;state.prayerDay=todayStr();state.clockTimer=setInterval(()=>{const t=liveTime();const h=document.getElementById('heroClock'),p=document.getElementById('prayClock');if(h)h.textContent=t;if(p)p.textContent=t;updateNextPrayer();const day=todayStr();if(day!==state.prayerDay){state.prayerDay=day;state.prayer=null;state.imsakiyah=null;loadPrayer(true).catch(()=>{});if(state.currentPage==='imsakiyah')loadImsakiyah(true).catch(()=>{})}},1000)}
async function shareText(text){if(navigator.share)await navigator.share({title:'RT 01 RW 04',text});else{await navigator.clipboard?.writeText(text);toast('Teks disalin')}}
function fileToDataUrl(file){return new Promise((res,rej)=>{if(file.size>8*1024*1024)return rej(new Error('Ukuran file maksimal 8 MB'));const r=new FileReader();r.onload=()=>{if(!String(file.type||'').startsWith('image/'))return res(r.result);const img=new Image();img.onload=()=>{let w=img.width,h=img.height,max=1600;if(w>max){h=Math.round(h*max/w);w=max}const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c.toDataURL('image/jpeg',.82))};img.onerror=rej;img.src=r.result};r.onerror=rej;r.readAsDataURL(file)})}
async function filesToDataUrls(files,max){const out=[];for(const f of Array.from(files).slice(0,max||8))out.push(await fileToDataUrl(f));return out}
