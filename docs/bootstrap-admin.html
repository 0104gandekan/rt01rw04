<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Setup Admin RT01 V6</title><style>body{font-family:Arial;background:linear-gradient(145deg,#045b48,#0a8d6d);margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;color:#172033}.card{width:min(520px,100%);background:#fff;border-radius:24px;padding:24px;box-shadow:0 25px 60px #0003}.field{margin:10px 0}.field label{font-size:12px;font-weight:700;display:block;margin-bottom:5px}.field input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #dce3eb;border-radius:11px}button{width:100%;border:0;border-radius:11px;padding:11px;margin-top:8px;font-weight:800}.green{background:#08775e;color:#fff}.light{background:#eef2f6;color:#172033}.note{font-size:11px;color:#667085;line-height:1.55}.status{margin-top:12px;padding:10px;border-radius:10px;background:#f6f8fb;font-size:11px;white-space:pre-wrap}</style>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script><script src="./js/firebase-config.js"></script><script src="./js/drive-api.js"></script><script src="./js/v6-api.js"></script></head><body><div class="card"><h2>Setup Super Admin V6</h2><p class="note">Halaman ini dipakai sekali untuk membuat/menyiapkan Super Admin. Password tidak disimpan di source GitHub.</p><div class="field"><label>Email Admin</label><input id="email" value="arjune@gandekan.id"></div><div class="field"><label>Password</label><input id="pass" type="password" placeholder="Masukkan password admin"></div><button class="green" onclick="createAdminAuth()">1. Buat Akun Firebase Admin</button><button class="light" onclick="loginAdminAuth()">2. Login Setelah Verifikasi Email</button><button class="green" onclick="activateAdmin()">3. Aktifkan SUPER_ADMIN</button><button class="green" onclick="seedData()">4. Isi Data Awal RT</button><button class="light" onclick="location.href='./admin.html'">Buka Dashboard Admin</button><div id="status" class="status">Urutan: buat akun → cek email dan verifikasi → login → aktifkan Super Admin → isi data awal.</div></div><script>
const st=document.getElementById('status');function msg(x){st.textContent=x}
async function init(){try{await RTV6.init();msg('Firebase siap. Email bootstrap: '+RT_APP_CONFIG.ADMIN_BOOTSTRAP_EMAIL)}catch(e){msg(e.message)}}init();
async function createAdminAuth(){try{const e=email.value.trim(),p=pass.value;if(e.toLowerCase()!==RT_APP_CONFIG.ADMIN_BOOTSTRAP_EMAIL.toLowerCase())throw Error('Gunakan email bootstrap yang sudah ditetapkan.');const c=await firebase.auth().createUserWithEmailAndPassword(e,p);await c.user.sendEmailVerification();msg('Akun Auth dibuat. Tautan verifikasi sudah dikirim. Verifikasi email lalu kembali ke halaman ini.')}catch(e){msg(e.message)}}
async function loginAdminAuth(){try{const c=await firebase.auth().signInWithEmailAndPassword(email.value.trim(),pass.value);await c.user.reload();if(!c.user.emailVerified){await c.user.sendEmailVerification();throw Error('Email belum diverifikasi. Tautan verifikasi dikirim ulang.');}msg('Login berhasil dan email sudah terverifikasi. Lanjutkan langkah 3.')}catch(e){msg(e.message)}}
async function activateAdmin(){try{const r=await RTV6.bootstrapSuperAdmin();msg('SUPER_ADMIN aktif: '+JSON.stringify(r.user,null,2))}catch(e){msg(e.message)}}
async function seedData(){try{const r=await RTV6.seedInitialData();msg('Data awal berhasil dibuat. '+JSON.stringify(r))}catch(e){msg(e.message)}}
</script></body></html>
