<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Diagnostik V6</title><style>body{font-family:Arial;background:#f4f7fb;margin:0;color:#172033}.wrap{max-width:760px;margin:30px auto;padding:16px}.card{background:#fff;border:1px solid #e5eaf0;border-radius:18px;padding:18px;margin:12px 0}.ok{color:#08775e}.bad{color:#c93232}button{border:0;border-radius:10px;padding:10px 13px;background:#08775e;color:#fff;font-weight:700;margin:4px}pre{white-space:pre-wrap;background:#f7f9fb;border-radius:12px;padding:12px;overflow:auto}</style>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging-compat.js"></script><script src="./js/firebase-config.js"></script><script src="./js/drive-api.js"></script><script src="./js/v6-api.js"></script></head><body><div class="wrap"><h1>Diagnostik RT01 V6</h1><div class="card"><b>Arsitektur</b><p>GitHub Pages → Firebase Auth/Firestore realtime. Apps Script hanya untuk Drive/PDF/Push.</p></div><div class="card"><button onclick="testFirebase()">Tes Firebase</button><button onclick="testDrive()">Tes Apps Script</button><button onclick="clearCache()">Bersihkan Cache PWA</button><pre id="out">Siap.</pre></div></div><script>
const out=document.getElementById('out');function show(x,ok=true){out.className=ok?'ok':'bad';out.textContent=typeof x==='string'?x:JSON.stringify(x,null,2)}
async function testFirebase(){try{await RTV6.init();const b=await RTV6.publicBundle();show({ok:true,project:RT_FIREBASE_CONFIG.projectId,version:b.version,ronda:b.rondaWeek.length,posyandu:b.posyandu.length,kegiatan:b.kegiatan.length})}catch(e){show(e.message,false)}}
async function testDrive(){try{show(await RTDriveApi.post('health',{},''))}catch(e){show(e.message,false)}}
async function clearCache(){try{for(const k of await caches.keys())await caches.delete(k);for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();localStorage.removeItem(RT_APP_CONFIG.PUBLIC_CACHE_KEY);show('Cache dan Service Worker sudah dibersihkan. Muat ulang halaman.') }catch(e){show(e.message,false)}}
</script></body></html>
